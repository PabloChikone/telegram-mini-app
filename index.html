<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика ЕГИСЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 16px;
            color: #1a1a2e;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .header p { font-size: 12px; opacity: 0.9; }
        
        .block {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .block-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .period-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .period-btn {
            padding: 4px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            background: white;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
            font-weight: 500;
        }
        .period-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .period-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: #f8f9fc;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .stat-card:hover { transform: translateY(-1px); background: #f0f2ff; }
        .stat-card.active {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .stat-card .label {
            font-size: 10px;
            color: #666;
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.3;
        }
        .stat-card .change {
            font-size: 10px;
            font-weight: 600;
        }
        .stat-card .change.positive { color: #4CAF50; }
        .stat-card .change.negative { color: #f44336; }
        .stat-card .change.zero { color: #999; }
        
        .status-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
            justify-content: center;
        }
        .status-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 12px;
            background: #f8f9fc;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .status-legend .legend-item.active {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .status-legend .legend-item .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .chart-container {
            background: #f8f9fc;
            padding: 12px;
            border-radius: 10px;
            height: 250px;
            position: relative;
        }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
        
        .loading { text-align: center; padding: 20px; color: #999; font-size: 13px; }
        .error { background: #fee; color: #c00; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; font-size: 13px; }
        
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-card .value { font-size: 14px; }
            .period-btn { font-size: 10px; padding: 3px 10px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>📊 Статистика ЕГИСЗ</h1>
            <p id="updateTime">Загрузка...</p>
        </div>

        <!-- Блок 1: Год -->
        <div class="block" id="blockYear">
            <div class="block-title">📅 Год</div>
            <div class="period-buttons" id="periodYear"></div>
            <div class="stats-grid" id="statsYear"></div>
            <div class="status-legend" id="legendYear"></div>
            <div class="chart-container">
                <canvas id="chartYear"></canvas>
            </div>
        </div>

        <!-- Блок 2: Сегодня -->
        <div class="block" id="blockToday">
            <div class="block-title">📊 Сегодня</div>
            <div class="period-buttons" id="periodToday"></div>
            <div class="stats-grid" id="statsToday"></div>
            <div class="status-legend" id="legendToday"></div>
            <div class="chart-container">
                <canvas id="chartToday"></canvas>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const JSON_URL = 'statistics.json';
        let fullData = null;
        
        const state = {
            year: { period: 'month', status: 'all', chart: null },
            today: { period: '1h', status: 'all', chart: null }
        };

        const STATUSES = {
            '0 - Ожидает выгрузки': { label: '⏳ [0] Ожидает', short: '[0] Ожидает' },
            '1 - Отправлено в ЕГИСЗ': { label: '📤 [1] Отправлено', short: '[1] Отправлено' },
            '2 - Ошибка формирования': { label: '❌ [2] Ошибка форм.', short: '[2] Ошибка форм.' },
            '3 - Ошибка первичной валидации': { label: '⚠️ [3] Ошибка валид.', short: '[3] Ошибка валид.' },
            '4 - Документ принят успешно': { label: '✅ [4] Принято', short: '[4] Принято' },
            '5 - Документ отклонен ЕГИСЗ': { label: '🚫 [5] Отклонено', short: '[5] Отклонено' }
        };

        const COLORS = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
        
        const PERIODS_YEAR = [
            { id: 'month', label: 'За месяц', hours: 720 },
            { id: 'week', label: 'За неделю', hours: 168 },
            { id: 'day', label: 'За день', hours: 24 },
            { id: 'hour', label: 'За час', hours: 1 }
        ];
        
        const PERIODS_TODAY = [
            { id: '1h', label: 'За 1 час', hours: 1 },
            { id: '3h', label: 'За 3 часа', hours: 3 },
            { id: '6h', label: 'За 6 часов', hours: 6 },
            { id: '12h', label: 'За 12 часов', hours: 12 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
        });

        async function loadStatistics() {
            showLoading(true);
            try {
                const response = await fetch(JSON_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Не удалось загрузить данные');
                fullData = await response.json();
                
                const updateTime = new Date(fullData.last_update);
                document.getElementById('updateTime').textContent = 
                    `Обновлено: ${updateTime.toLocaleString('ru-RU')}`;
                
                renderBlock('year', fullData.year);
                renderBlock('today', fullData.today);
                showError(null);
            } catch (error) {
                console.error('Error:', error);
                showError('Ошибка загрузки данных');
            } finally {
                showLoading(false);
            }
        }

        function renderBlock(blockName, sheetData) {
            if (!sheetData) return;
            
            const s = state[blockName];
            const prefix = blockName === 'year' ? 'Year' : 'Today';
            const periods = blockName === 'year' ? PERIODS_YEAR : PERIODS_TODAY;
            
            const periodInfo = periods.find(p => p.id === s.period);
            const hours = periodInfo ? periodInfo.hours : 999999;
            
            const filtered = filterDataByHours(sheetData, hours);
            const lastIndex = filtered.labels.length - 1;
            
            renderPeriodButtons(prefix, periods, s.period, blockName);
            renderStats(prefix, filtered, lastIndex, blockName);
            renderLegend(prefix, filtered, blockName);
            renderChart(prefix, filtered, blockName);
        }

        function filterDataByHours(sheetData, hours) {
            const labels = sheetData.labels;
            const data = sheetData.data;
            
            if (hours >= 999999 || labels.length === 0) {
                return { labels, data, startIndex: 0 };
            }
            
            // Находим ближайшую точку к заданному количеству часов
            const targetPoints = Math.min(Math.floor(hours * 12), labels.length);
            const startIndex = Math.max(0, labels.length - targetPoints);
            
            return {
                labels: labels.slice(startIndex),
                data: Object.fromEntries(
                    Object.entries(data).map(([key, values]) => [key, values.slice(startIndex)])
                ),
                startIndex: startIndex
            };
        }

        function renderPeriodButtons(prefix, periods, activePeriod, blockName) {
            const container = document.getElementById(`period${prefix}`);
            if (!container) return;
            
            container.innerHTML = periods.map(p => `
                <button class="period-btn ${p.id === activePeriod ? 'active' : ''}" data-period="${p.id}" data-block="${blockName}">
                    ${p.label}
                </button>
            `).join('');

            container.querySelectorAll('.period-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const block = this.dataset.block;
                    const period = this.dataset.period;
                    state[block].period = period;
                    renderBlock(block, fullData[block]);
                });
            });
        }

        function renderStats(prefix, filtered, lastIndex, blockName) {
            const container = document.getElementById(`stats${prefix}`);
            if (!container || lastIndex < 0) {
                container.innerHTML = '<div class="error">Нет данных</div>';
                return;
            }

            // Берем первую точку в отфильтрованных данных (начало периода)
            const startIndex = 0;
            const s = state[blockName];
            
            let html = '';
            for (const [key, values] of Object.entries(filtered.data)) {
                if (!values || values.length === 0) continue;
                const status = STATUSES[key];
                if (!status) continue;
                
                const current = values[lastIndex] || 0;
                const startValue = values[startIndex] || 0;
                const diff = current - startValue;
                
                const diffText = diff > 0 ? `+${diff}` : (diff < 0 ? `${diff}` : '0');
                const diffClass = diff > 0 ? 'positive' : (diff < 0 ? 'negative' : 'zero');
                const isActive = s.status === 'all' || s.status === key;
                
                html += `
                    <div class="stat-card ${isActive ? 'active' : ''}" data-status="${key}" data-block="${blockName}">
                        <div class="label">${status.label}</div>
                        <div class="value">${current.toLocaleString()}</div>
                        <div class="change ${diffClass}">${diffText}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;

            container.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', function() {
                    const block = this.dataset.block;
                    const status = this.dataset.status;
                    const s = state[block];
                    s.status = (s.status === status) ? 'all' : status;
                    renderBlock(block, fullData[block]);
                });
            });
        }

        function renderLegend(prefix, filtered, blockName) {
            const container = document.getElementById(`legend${prefix}`);
            if (!container) return;
            
            const s = state[blockName];
            const statusKeys = Object.keys(filtered.data);
            
            let html = '';
            html += `<div class="legend-item ${s.status === 'all' ? 'active' : ''}" data-status="all" data-block="${blockName}">
                <span style="font-weight:600;font-size:11px;">Все</span>
            </div>`;
            
            statusKeys.forEach((key, idx) => {
                const status = STATUSES[key];
                if (!status) return;
                const isActive = s.status === key;
                html += `
                    <div class="legend-item ${isActive ? 'active' : ''}" data-status="${key}" data-block="${blockName}">
                        <span class="color-dot" style="background:${COLORS[idx % COLORS.length]}"></span>
                        <span>${status.short}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;

            container.querySelectorAll('.legend-item').forEach(item => {
                item.addEventListener('click', function() {
                    const block = this.dataset.block;
                    const status = this.dataset.status;
                    const s = state[block];
                    s.status = status === 'all' ? 'all' : status;
                    renderBlock(block, fullData[block]);
                });
            });
        }

        function renderChart(prefix, filtered, blockName) {
            const canvasId = `chart${prefix}`;
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const s = state[blockName];
            
            if (s.chart) {
                s.chart.destroy();
                s.chart = null;
            }

            if (filtered.labels.length < 2) {
                return;
            }

            const statusKeys = Object.keys(filtered.data);
            let datasets = [];

            if (s.status === 'all') {
                statusKeys.forEach((key, idx) => {
                    const values = filtered.data[key];
                    if (!values || values.length < 2) return;
                    const status = STATUSES[key];
                    datasets.push({
                        label: status ? status.short : key,
                        data: values,
                        borderColor: COLORS[idx % COLORS.length],
                        backgroundColor: COLORS[idx % COLORS.length] + '15',
                        borderWidth: 2,
                        pointRadius: 1,
                        tension: 0.3,
                        fill: false
                    });
                });
            } else {
                const values = filtered.data[s.status];
                if (values && values.length >= 2) {
                    const status = STATUSES[s.status];
                    datasets.push({
                        label: status ? status.short : s.status,
                        data: values,
                        borderColor: '#667eea',
                        backgroundColor: '#667eea25',
                        borderWidth: 3,
                        pointRadius: 2,
                        tension: 0.3,
                        fill: true
                    });
                }
            }

            if (datasets.length === 0) return;

            let allValues = [];
            datasets.forEach(ds => { allValues = allValues.concat(ds.data); });
            const minVal = Math.min(...allValues);
            const maxVal = Math.max(...allValues);
            const padding = (maxVal - minVal) * 0.15 || 1000;

            s.chart = new Chart(ctx, {
                type: 'line',
                data: { labels: filtered.labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { font: { size: 9 }, boxWidth: 10, padding: 4 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: Math.max(0, minVal - padding),
                            max: maxVal + padding,
                            ticks: {
                                callback: function(value) { return value.toLocaleString(); },
                                font: { size: 9 }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 12,
                                autoSkip: true,
                                maxRotation: 25,
                                font: { size: 8 }
                            }
                        }
                    }
                }
            });
        }

        function showLoading(show) {
            document.getElementById('statusMessage').innerHTML = show ? 
                '<div class="loading">⏳ Загрузка данных...</div>' : '';
        }

        function showError(message) {
            document.getElementById('statusMessage').innerHTML = message ? 
                `<div class="error">⚠️ ${message}</div>` : '';
        }

        setInterval(loadStatistics, 60000);
    </script>
</body>
</html>
