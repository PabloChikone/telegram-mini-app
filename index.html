<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика ЕГИСЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .tab-btn:hover:not(.active) {
            background: #f0f0f0;
        }
        .period-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .period-btn {
            padding: 6px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }
        .period-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .period-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }
        .chart-container {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 16px;
            position: relative;
            height: 400px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .summary-card .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        .summary-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
            .header h1 {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>📊 Статистика ЕГИСЗ</h1>
            <p id="updateTime">Загрузка...</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-sheet="year">📅 Год</button>
            <button class="tab-btn" data-sheet="today">📊 Сегодня</button>
        </div>

        <div class="period-buttons">
            <button class="period-btn active" data-period="all">Все время</button>
            <button class="period-btn" data-period="week">Неделя</button>
            <button class="period-btn" data-period="day">День</button>
            <button class="period-btn" data-period="hour">Час</button>
        </div>

        <div id="summaryContainer" class="summary"></div>

        <div class="chart-container">
            <canvas id="statChart"></canvas>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const JSON_URL = 'statistics.json';
        let currentSheet = 'year';
        let currentPeriod = 'all';
        let chart = null;
        let fullData = null;

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupPeriodButtons();
            loadStatistics();
        });

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentSheet = this.dataset.sheet;
                    updateChart();
                });
            });
        }

        function setupPeriodButtons() {
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPeriod = this.dataset.period;
                    updateChart();
                });
            });
        }

        async function loadStatistics() {
            showLoading(true);
            
            try {
                const response = await fetch(JSON_URL + '?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('Не удалось загрузить данные');
                }
                
                fullData = await response.json();
                
                // Обновляем время
                const updateTime = new Date(fullData.last_update);
                document.getElementById('updateTime').textContent = 
                    `Обновлено: ${updateTime.toLocaleString()}`;
                
                updateChart();
                showError(null);
                
            } catch (error) {
                console.error('Error:', error);
                showError('Ошибка загрузки данных');
            } finally {
                showLoading(false);
            }
        }

        function updateChart() {
            if (!fullData) return;
            
            const sheetData = fullData[currentSheet];
            if (!sheetData) {
                showError('Нет данных для отображения');
                return;
            }

            const filtered = filterData(sheetData, currentPeriod);
            renderChart(filtered);
            renderSummary(filtered);
        }

        function filterData(sheetData, period) {
            const labels = sheetData.labels;
            const data = sheetData.data;
            
            if (period === 'all' || labels.length === 0) {
                return { labels, data };
            }
            
            // Определяем количество точек для фильтрации
            let pointsToKeep;
            const now = new Date();
            
            switch(period) {
                case 'hour':
                    pointsToKeep = 12; // 12 точек по 5 минут
                    break;
                case 'day':
                    pointsToKeep = 288; // 288 точек по 5 минут
                    break;
                case 'week':
                    pointsToKeep = 2016; // 2016 точек по 5 минут
                    break;
                default:
                    pointsToKeep = labels.length;
            }
            
            // Берем последние N точек
            const startIndex = Math.max(0, labels.length - pointsToKeep);
            
            return {
                labels: labels.slice(startIndex),
                data: Object.fromEntries(
                    Object.entries(data).map(([key, values]) => [
                        key, 
                        values.slice(startIndex)
                    ])
                )
            };
        }

        function renderChart(filtered) {
            const ctx = document.getElementById('statChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            if (!filtered.labels || filtered.labels.length === 0) {
                showError('Нет данных для отображения');
                return;
            }

            const statusMap = {
                '0 - Ожидает выгрузки': '⏳ Ожидает',
                '1 - Отправлено в ЕГИСЗ': '📤 Отправлено',
                '2 - Ошибка формирования': '❌ Ошибка форм.',
                '3 - Ошибка первичной валидации': '⚠️ Ошибка валид.',
                '4 - Документ принят успешно': '✅ Принято',
                '5 - Документ отклонен ЕГИСЗ': '🚫 Отклонено'
            };

            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
            
            const datasets = Object.entries(filtered.data).map(([key, values], index) => ({
                label: statusMap[key] || key,
                data: values,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length] + '40',
                fill: false,
                tension: 0.4,
                pointRadius: 0,
                borderWidth: 2
            }));

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: filtered.labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: { size: 10 },
                                boxWidth: 12,
                                padding: 8
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 20,
                                autoSkip: true,
                                maxRotation: 45
                            }
                        }
                    }
                }
            });
        }

        function renderSummary(filtered) {
            const container = document.getElementById('summaryContainer');
            let html = '';
            
            // Берем последние значения
            const lastIndex = filtered.labels.length - 1;
            if (lastIndex >= 0) {
                const statusMap = {
                    '0 - Ожидает выгрузки': '⏳ Ожидает',
                    '1 - Отправлено в ЕГИСЗ': '📤 Отправлено',
                    '2 - Ошибка формирования': '❌ Ошибка форм.',
                    '3 - Ошибка первичной валидации': '⚠️ Ошибка валид.',
                    '4 - Документ принят успешно': '✅ Принято',
                    '5 - Документ отклонен ЕГИСЗ': '🚫 Отклонено'
                };
                
                for (const [key, values] of Object.entries(filtered.data)) {
                    if (values && values.length > 0) {
                        const label = statusMap[key] || key;
                        const value = values[lastIndex] || 0;
                        html += `
                            <div class="summary-card">
                                <div class="label">${label}</div>
                                <div class="value">${value.toLocaleString()}</div>
                            </div>
                        `;
                    }
                }
            }
            
            container.innerHTML = html || '<div class="error">Нет данных для отображения</div>';
        }

        function showLoading(show) {
            document.getElementById('statusMessage').innerHTML = show ? 
                '<div class="loading">⏳ Загрузка данных...</div>' : '';
        }

        function showError(message) {
            const container = document.getElementById('statusMessage');
            if (message) {
                container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
            } else {
                container.innerHTML = '';
            }
        }

        // Автообновление каждые 60 секунд
        setInterval(loadStatistics, 60000);
    </script>
</body>
</html>
