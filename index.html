<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Ваши мета-теги -->
    <title>Мое мини-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <h1>Добро пожаловать!</h1>
        <p id="user-info">Загрузка данных пользователя...</p>
    </div>

    <script>
        // Инициализируем WebApp
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что приложение загружено

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;

        if (user) {
            const userId = user.id;
            const userFullName = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            
            // Отображаем информацию (можно использовать для проверки)
            document.getElementById('user-info').innerText = 
                `Привет, ${userFullName}! (ID: ${userId})`;
            
            // Теперь вы можете отправить этот userId на свой бэкенд для проверки
            // или использовать в логике приложения
            console.log('User ID:', userId);
            console.log('User Name:', userFullName);
            
            // Пример: проверка на бэкенде (отправка POST запроса)
            // fetch('/api/check-user', { method: 'POST', body: JSON.stringify({ userId }) })
            //     .then(response => response.json())
            //     .then(data => { /* Обработка ответа */ });
        } else {
            document.getElementById('user-info').innerText = 
                'Не удалось получить данные пользователя. Убедитесь, что приложение открыто из Telegram.';
        }
    </script>
</body>
</html>
